# Generates the JNI bindings of aud_midi_android:
# lib/src/jni/midi_android_jni_bindings.g.dart.
#
# Regenerate after changing this file or the Java shim (see README.md):
#
#   export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
#   export ANDROID_SDK_ROOT="$HOME/Library/Android/sdk"
#   dart run jnigen --config jnigen.yaml
#
# The Android classes come from platforms/android-36/android.jar, the shim
# classes from the sources in android/src/main/java.

android_sdk_config:
  versions: ["36"]

source_path:
  - "android/src/main/java"

classes:
  # android.media.midi
  - "android.media.midi.MidiManager"
  - "android.media.midi.MidiDevice"
  - "android.media.midi.MidiDeviceInfo"
  - "android.media.midi.MidiInputPort"
  - "android.media.midi.MidiOutputPort"
  - "android.media.midi.MidiReceiver"
  - "android.media.midi.MidiSender"
  # Device properties
  - "android.os.BaseBundle"
  - "android.os.Bundle"
  # API level
  - "android.os.Build"
  # Bluetooth LE MIDI
  - "android.bluetooth.BluetoothManager"
  - "android.bluetooth.BluetoothAdapter"
  - "android.bluetooth.BluetoothDevice"
  - "android.bluetooth.le.BluetoothLeScanner"
  - "android.bluetooth.le.ScanFilter"
  - "android.bluetooth.le.ScanSettings"
  - "android.bluetooth.le.ScanResult"
  - "android.bluetooth.le.ScanRecord"
  - "android.os.ParcelUuid"
  # Network service discovery and multicast
  - "android.net.nsd.NsdManager"
  - "android.net.nsd.NsdServiceInfo"
  - "android.net.wifi.WifiManager"
  # The Java shim
  - "com.audanika.aud_midi_android.AudMidiContext"
  - "com.audanika.aud_midi_android.AudMidiDataListener"
  - "com.audanika.aud_midi_android.AudMidiReceiver"
  - "com.audanika.aud_midi_android.AudMidiNativeTap"
  - "com.audanika.aud_midi_android.AudMidiDeviceListener"
  - "com.audanika.aud_midi_android.AudMidiDeviceCallback"
  - "com.audanika.aud_midi_android.AudMidiScanListener"
  - "com.audanika.aud_midi_android.AudMidiScanCallback"
  - "com.audanika.aud_midi_android.AudMidiVirtualDevices"
  - "com.audanika.aud_midi_android.AudMidiLoopbackService"

output:
  dart:
    path: "lib/src/jni/midi_android_jni_bindings.g.dart"
    structure: single_file

preamble: |
