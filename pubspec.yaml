name: aud_midi_android
description: "Android backend for aud_midi: android.media.midi via JNI, AMidi via FFI"
version: 0.2.1
homepage: https://github.com/audmidi/aud_midi_android
repository: https://github.com/audmidi/aud_midi_android
topics:
  - midi
  - audio
  - music
platforms:
  android:

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# The example resolves together with the package, so that upgrading the
# package upgrades the example too.
workspace:
  - example

dev_dependencies:
  dna_audanika: ^0.1.0
  ffigen: ^23.0.0
  helix: ^1.14.0
  jnigen: ^1.0.1
  lints: ^6.1.0
  test: ^1.33.0
dependencies:
  aud_midi_core: ^0.2.0
  aud_midi_standard: ^0.3.0
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  jni: ^1.1.1
  native_toolchain_c: ^0.19.5

# Builds the Java shim in android/ into Android apps. The package has no
# Flutter dependency: the plugin class only exists so that Flutter compiles
# the shim, it registers no channel.
flutter:
  plugin:
    platforms:
      android:
        package: com.audanika.aud_midi_android
        pluginClass: AudMidiAndroidPlugin