# Bindings for the native tap library of the package, src/aud_midi_android.h,
# which the build hook builds for Android. Regenerate with
#
#   dart run ffigen --config ffigen_tap.yaml
#
# The functions resolve through the code asset of the build hook.
name: AudMidiAndroidBindings
description: Bindings for the native tap library of aud_midi_android.
output: lib/src/native/aud_midi_android_bindings.g.dart
language: c
headers:
  entry-points:
    - src/aud_midi_android.h
ffi-native:
  asset-id: package:aud_midi_android/src/native/aud_midi_android_bindings.g.dart
exclude-all-by-default: true
functions:
  include:
    - aud_midi_android_.*
  leaf:
    include:
      - aud_midi_android_now_ns
      - aud_midi_android_tap_in_flight
      - aud_midi_android_tap_count
typedefs:
  include:
    - AudMidiAndroidTapFunction
macros:
  include:
    - AUD_MIDI_ANDROID_.*
preamble: |
  // @license
  // Copyright (c) Audanika
  //
  // Use of this source code is governed by terms that can be
  // found in the LICENSE file in the root of this package.

  // Generated by ffigen from ffigen_tap.yaml. Do not edit.
  // coverage:ignore-file
  // ignore_for_file: type=lint, unused_field, unused_element
comments:
  style: any
  length: brief
